<html>
  <div
    style="
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 20px;
      margin: 50px auto;
      width: 400px;
    "
  >
    <h1>Settings</h1>
    <p>Font</p>
    <section>
      <p>Font Size:</p>
      <input
        type="number"
        id="fontSize"
        name="fontSize"
        min="8"
        max="72"
        value="16"
      />
      <p>Font Family:</p>
      <select id="fontFamily" name="fontFamily">
        <option value="Arial">Arial</option>
        <option value="Verdana">Verdana</option>
        <option value="Times New Roman">Times New Roman</option>
        <option value="Courier New">Courier New</option>
      </select>
    </section>
    <section>
      <p>Brightness:</p>
      <input
        type="number"
        id="brightness"
        name="brightness"
        min="0"
        max="100"
        value="50"
      />
      <p>Color</p>
      <select id="fontFamily" name="fontFamily">
        <option value="Arial">red</option>
        <option value="Verdana">green</option>
        <option value="Times New Roman">blue</option>
        <option value="Courier New">yellow</option>
        <optgroup label="More Colors">
          <option value="orange">orange</option>
          <option value="purple">purple</option>
          <option value="pink">pink</option>
        </optgroup>
      </select>
    </section>
    <section>
      <p>Scale:</p>
      <input type="number" id="scale" name="scale" min="1" max="10" value="1" />
      <p>Width:</p>
      <select id="fontFamily" name="fontFamily">
        <option value="100px">100px</option>
        <option value="200px">200px</option>
        <option value="300px">300px</option>
        <option value="400px">400px</option>
      </select>
    </section>
  </div>
</html>
