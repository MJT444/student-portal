<html>
  <head>
    <title>Login</title>
  </head>
  <body>
    <div
      style="
        display: flex;
        flex-direction: column;
        align-items: center;
        border: 1px solid #ccc;
        border-radius: 5px;
        padding: 20px;
        margin: 50px auto;
        width: 400px;
      "
    >
      <h2>Login</h2>
      <form
        action="dashboard.html"
        method="post"
        style="display: flex; flex-direction: column; width: 300px"
      >
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required /><br /><br />
        <label for="password">Password:</label>
        <input
          type="password"
          id="password"
          name="password"
          required
        /><br /><br />
        <input type="submit" value="Login" />
      </form>

      <section>
        <h3>Forgot Password?</h3>
        <p>
          If you forgot your password, please contact the administration office
          to reset it.
        </p>
      </section>
      <section>
        <h3>New User?</h3>
        <p>
          If you are a new user, please contact the administration office to
          create an account.
        </p>
      </section>
    </div>
  </body>
</html>
